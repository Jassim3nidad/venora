name: Hosted staging verification

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Non-production HTTPS deployment URL
        required: true
        type: string
      expected_commit:
        description: Full 40-character commit deployed to staging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-staging-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Hosted E2E, accessibility, and Storage RLS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      VENORA_TEST_ENVIRONMENT: confirmed
      VENORA_ENVIRONMENT_CLASS: staging
      APP_BASE_URL: ${{ inputs.deployment_url }}
      DEPLOYMENT_URL: ${{ inputs.deployment_url }}
      DEPLOYMENT_TIER: staging
      EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      STAGING_ALLOWED_HOSTS: ${{ vars.STAGING_ALLOWED_HOSTS }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
      E2E_CUSTOMER_EMAIL: ${{ secrets.STAGING_E2E_CUSTOMER_EMAIL }}
      E2E_CUSTOMER_PASSWORD: ${{ secrets.STAGING_E2E_CUSTOMER_PASSWORD }}
      E2E_VENUE_EMAIL: ${{ secrets.STAGING_E2E_VENUE_EMAIL }}
      E2E_VENUE_PASSWORD: ${{ secrets.STAGING_E2E_VENUE_PASSWORD }}
      E2E_COORDINATOR_EMAIL: ${{ secrets.STAGING_E2E_COORDINATOR_EMAIL }}
      E2E_COORDINATOR_PASSWORD: ${{ secrets.STAGING_E2E_COORDINATOR_PASSWORD }}
      E2E_SUPPLIER_EMAIL: ${{ secrets.STAGING_E2E_SUPPLIER_EMAIL }}
      E2E_SUPPLIER_PASSWORD: ${{ secrets.STAGING_E2E_SUPPLIER_PASSWORD }}
      E2E_SUPERADMIN_EMAIL: ${{ secrets.STAGING_E2E_SUPERADMIN_EMAIL }}
      E2E_SUPERADMIN_PASSWORD: ${{ secrets.STAGING_E2E_SUPERADMIN_PASSWORD }}
      E2E_ANALYST_ADMIN_EMAIL: ${{ secrets.STAGING_E2E_ANALYST_ADMIN_EMAIL }}
      E2E_ANALYST_ADMIN_PASSWORD: ${{ secrets.STAGING_E2E_ANALYST_ADMIN_PASSWORD }}
      E2E_FINANCE_ADMIN_EMAIL: ${{ secrets.STAGING_E2E_FINANCE_ADMIN_EMAIL }}
      E2E_FINANCE_ADMIN_PASSWORD: ${{ secrets.STAGING_E2E_FINANCE_ADMIN_PASSWORD }}
      RLS_TENANT_A_EMAIL: ${{ secrets.STAGING_RLS_TENANT_A_EMAIL }}
      RLS_TENANT_A_PASSWORD: ${{ secrets.STAGING_RLS_TENANT_A_PASSWORD }}
      RLS_TENANT_B_EMAIL: ${{ secrets.STAGING_RLS_TENANT_B_EMAIL }}
      RLS_TENANT_B_PASSWORD: ${{ secrets.STAGING_RLS_TENANT_B_PASSWORD }}
      RLS_NON_MEMBER_EMAIL: ${{ secrets.STAGING_RLS_NON_MEMBER_EMAIL }}
      RLS_NON_MEMBER_PASSWORD: ${{ secrets.STAGING_RLS_NON_MEMBER_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out trusted main workflow commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 9.15.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: 22.17.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Bind executable code and deployment to main
        run: test "$GITHUB_REF" = "refs/heads/main" && test "$GITHUB_SHA" = "$EXPECTED_COMMIT_SHA" && test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Guard non-production target
        run: pnpm hosted:guard
      - name: Verify hosted migration and policy definitions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci
          psql "$SUPABASE_STAGING_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 <<'SQL' > artifacts/ci/hosted-database-contracts.txt
          DO $verify$
          DECLARE
            policy_contract text;
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM supabase_migrations.schema_migrations
              WHERE version IN ('071', '71')
            ) THEN
              RAISE EXCEPTION 'migration 071 is absent';
            END IF;

            IF (
              SELECT count(*)
              FROM pg_policies
              WHERE schemaname = 'storage'
                AND tablename = 'objects'
                AND policyname IN (
                  'venue-images.insert.venue-owner',
                  'venue-images.update.venue-owner',
                  'venue-images.delete.venue-owner'
                )
            ) <> 3 THEN
              RAISE EXCEPTION 'venue-media policy set is incomplete';
            END IF;

            SELECT string_agg(coalesce(qual, '') || coalesce(with_check, ''), ' ')
            INTO policy_contract
            FROM pg_policies
            WHERE schemaname = 'storage'
              AND tablename = 'objects'
              AND policyname LIKE 'venue-images.%.venue-owner';

            IF policy_contract NOT LIKE '%is_org_member%'
              OR policy_contract NOT LIKE '%foldername%'
              OR policy_contract NOT LIKE '%organization_id%'
            THEN
              RAISE EXCEPTION 'venue-media ownership predicates are incomplete';
            END IF;

            IF (
              SELECT count(*)
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'supplier_profiles'
                AND column_name IN (
                  'business_location_type',
                  'location_visibility',
                  'latitude',
                  'longitude',
                  'city',
                  'province',
                  'country',
                  'business_address',
                  'public_location_label',
                  'travel_available',
                  'travel_fee_note'
                )
            ) <> 11 THEN
              RAISE EXCEPTION 'supplier location migration contract is incomplete';
            END IF;
          END
          $verify$;
          SELECT 'hosted_database_contracts=PASS' AS result;
          SELECT version AS applied_migration
          FROM supabase_migrations.schema_migrations
          WHERE version IN ('071', '71')
          ORDER BY version;
          SELECT policyname,
                 md5(coalesce(cmd, '') || coalesce(qual, '') || coalesce(with_check, '')) AS definition_hash
          FROM pg_policies
          WHERE schemaname = 'storage'
            AND tablename = 'objects'
            AND policyname LIKE 'venue-images.%.venue-owner'
          ORDER BY policyname;
          SELECT count(*) AS supplier_location_columns
          FROM information_schema.columns
          WHERE table_schema = 'public'
            AND table_name = 'supplier_profiles'
            AND column_name IN (
              'business_location_type',
              'location_visibility',
              'latitude',
              'longitude',
              'city',
              'province',
              'country',
              'business_address',
              'public_location_label',
              'travel_available',
              'travel_fee_note'
            );
          SQL
      - name: Verify Vercel commit binding and smoke routes
        run: pnpm deployment:verify
      - name: Cache Playwright Chromium
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm --filter @venora/web exec playwright install --with-deps chromium
      - name: Verify hosted venue-media RLS
        run: pnpm hosted:rls
      - name: Run full hosted E2E and accessibility suite
        run: pnpm test:e2e
      - name: Generate release evidence
        if: always()
        run: pnpm release:manifest
      - name: Upload hosted evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-staging-evidence-${{ github.run_id }}
          path: artifacts/ci/
          if-no-files-found: error
          retention-days: 7
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-browser-failure-${{ github.run_id }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7
