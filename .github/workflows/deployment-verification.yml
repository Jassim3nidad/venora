name: Deployment verification

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tier:
        description: Protected deployment tier to verify
        required: true
        type: choice
        options: [preview, staging, production]
      deployment_url:
        description: HTTPS deployment URL
        required: true
        type: string
      expected_commit:
        description: Full 40-character deployed commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deployment-verification-${{ github.event_name == 'push' && 'production' || inputs.tier }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify deployment identity and smoke routes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'push' && 'production' || inputs.tier }}
    env:
      DEPLOYMENT_TIER: ${{ github.event_name == 'push' && 'production' || inputs.tier }}
      DEPLOYMENT_URL: ${{ github.event_name == 'push' && vars.PRODUCTION_BASE_URL || inputs.deployment_url }}
      APP_BASE_URL: ${{ github.event_name == 'push' && vars.PRODUCTION_BASE_URL || inputs.deployment_url }}
      EXPECTED_COMMIT_SHA: ${{ github.event_name == 'push' && github.sha || inputs.expected_commit }}
      DEPLOYMENT_WAIT_SECONDS: ${{ github.event_name == 'push' && '600' || '0' }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out trusted main verification code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: 22.17.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Confirm trusted workflow ref
        run: test "$GITHUB_REF" = "refs/heads/main" && test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify deployment
        run: pnpm deployment:verify
      - name: Cache Playwright Chromium
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm --filter @venora/web exec playwright install --with-deps chromium
      - name: Run safe public E2E and accessibility smoke
        run: pnpm --filter @venora/web exec playwright test e2e/public-deployment-smoke.spec.ts
      - name: Generate release manifest
        if: always()
        run: pnpm release:manifest
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-${{ github.event_name == 'push' && 'production' || inputs.tier }}-${{ github.run_id }}
          path: artifacts/ci/
          if-no-files-found: error
          retention-days: 7
      - name: Upload public-smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-browser-failure-${{ github.event_name == 'push' && 'production' || inputs.tier }}-${{ github.run_id }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7
