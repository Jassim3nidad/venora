name: Protected Supabase operations

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Protected environment
        required: true
        type: choice
        options: [staging, production]
      operation:
        description: Operation to perform
        required: true
        type: choice
        options: [database-plan, database-apply, edge-deploy]
      expected_commit:
        description: Full 40-character commit to operate from
        required: true
        type: string
      change_ticket:
        description: Approved release/change reference
        required: true
        type: string
      confirmation:
        description: PLAN/APPLY/DEPLOY confirmation documented in the runbook
        required: true
        type: string
      function_name:
        description: Edge Function name; required only for edge-deploy
        required: false
        type: string
      verify_jwt:
        description: Verified intended Edge JWT behavior
        required: true
        default: preserve
        type: choice
        options: [preserve, "true", "false"]

permissions:
  contents: read

concurrency:
  group: protected-supabase-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  operate:
    name: ${{ inputs.operation }} on ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target_environment }}
    env:
      EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit }}
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      DEPLOYMENT_TIER: ${{ inputs.target_environment }}
      OPERATION: ${{ inputs.operation }}
      CONFIRMATION: ${{ inputs.confirmation }}
      CHANGE_TICKET: ${{ inputs.change_ticket }}
      FUNCTION_NAME: ${{ inputs.function_name }}
      VERIFY_JWT: ${{ inputs.verify_jwt }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ inputs.target_environment == 'production' && vars.PRODUCTION_SUPABASE_PROJECT_REF || vars.STAGING_SUPABASE_PROJECT_REF }}
    steps:
      - name: Check out trusted main operation code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: 22.17.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.2
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create evidence directory
        run: mkdir -p artifacts/ci
      - name: Validate protected-operation inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${#EXPECTED_COMMIT_SHA}" -eq 40
          test -n "$CHANGE_TICKET"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          if [[ "$OPERATION" == database-* ]]; then
            test -n "$SUPABASE_DB_PASSWORD"
          fi
          case "$OPERATION" in
            database-plan) test "$CONFIRMATION" = "PLAN $TARGET_ENVIRONMENT" ;;
            database-apply) test "$CONFIRMATION" = "APPLY $TARGET_ENVIRONMENT" ;;
            edge-deploy)
              test "$CONFIRMATION" = "DEPLOY $FUNCTION_NAME TO $TARGET_ENVIRONMENT"
              [[ "$FUNCTION_NAME" =~ ^[a-z0-9][a-z0-9-]*$ ]]
              [[ "$VERIFY_JWT" == "true" || "$VERIFY_JWT" == "false" ]]
              ;;
          esac
      - name: Validate repository contracts
        run: pnpm test:database && pnpm edge:validate && pnpm ci:workflows:validate && pnpm test:secrets
      - name: Strictly validate selected Edge Function
        if: inputs.operation == 'edge-deploy'
        run: deno fmt --check "supabase/functions/$FUNCTION_NAME/index.ts" && deno check --no-config --node-modules-dir=none --frozen --lock=deno.lock "supabase/functions/$FUNCTION_NAME/index.ts"
      - name: Link protected Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Record migration state before operation
        if: startsWith(inputs.operation, 'database-')
        run: supabase migration list --linked --output-format json > artifacts/ci/migrations-before.json
      - name: Plan database migrations
        if: inputs.operation == 'database-plan'
        run: supabase db push --linked --dry-run | tee artifacts/ci/migration-plan.txt
      - name: Apply database migrations
        if: inputs.operation == 'database-apply'
        run: supabase db push --linked | tee artifacts/ci/migration-apply.txt
      - name: Record migration state after apply
        if: inputs.operation == 'database-apply'
        run: supabase migration list --linked --output-format json > artifacts/ci/migrations-after.json
      - name: Lint hosted schema after apply
        if: inputs.operation == 'database-apply'
        run: supabase db lint --linked --level error --fail-on error --output-format json > artifacts/ci/database-lint.json
      - name: Deploy Edge Function with JWT verification
        if: inputs.operation == 'edge-deploy' && inputs.verify_jwt == 'true'
        run: supabase functions deploy "$FUNCTION_NAME" --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: Deploy Edge Function without JWT verification
        if: inputs.operation == 'edge-deploy' && inputs.verify_jwt == 'false'
        run: supabase functions deploy "$FUNCTION_NAME" --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
      - name: Record and verify deployed Edge Function
        if: inputs.operation == 'edge-deploy'
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF" --output-format json > artifacts/ci/edge-functions-remote.json && pnpm edge:deployment:verify
      - name: Record operation evidence
        if: always()
        env:
          OPERATION_RESULT: ${{ job.status }}
        run: pnpm release:manifest
      - name: Upload operation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protected-operation-${{ github.run_id }}
          path: artifacts/ci/
          if-no-files-found: error
          retention-days: 7
